<!DOCTYPE html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
</head>


<body>
  
  <a-scene>
    <a-assets>
      <a-asset-item id="table" src="assets/rustic_wooden_picnic_table_high-quality_3d_model/scene.gltf"></a-asset-item>
      <a-asset-item id="picnicblanket" src="assets/picnic_gltf/scene.gltf"></a-asset-item>
      <a-asset-item id="tree" src="assets/mango_tree/scene.gltf"></a-asset-item>
      <a-asset-item id="sheep" src="assets/stuffed_sheep_toy_low_poly/scene.gltf"></a-asset-item>
      <a-asset-item id="toast" src="assets/toast_with_strawberry_jam/scene.gltf"></a-asset-item>
      <a-asset-item id="mouse" src="assets/cartoon_mouse_characters/scene.gltf"></a-asset-item>
       <img id="snowflake" src="assets/flower_3.webp">


    </a-assets>

    <a-entity gltf-model="#table" position="50 -10 -70" scale=" 5 5 5 "></a-entity>
    <a-entity gltf-model="#picnicblanket" position="-9.081 -5 -20"></a-entity>
    <a-entity gltf-model="#tree" position="25 -9 -70" scale='15 30 10 '></a-entity>
    <a-entity gltf-model="#sheep" position="-30 -5 -30" scale='10 10 10 'rotation="0 50 0"></a-entity>
    <a-entity gltf-model="#toast" position="30 3 -55" scale='0.5 0.5 0.5' ></a-entity>
    <a-entity gltf-model="#mouse" position="33 5 -53" scale='3 3 3' rotation="0 -30 0"></a-entity>
    <a-sky src="assets/background2.png" color="#ECECEC"></a-sky>

<a-entity snowfall></a-entity>


  </a-scene>
</body>
<script>
 AFRAME.registerComponent('snowfall', {
    init: function () {
      const scene = this.el;
      const snowCount = 200;
      const flakeSize = 0.7;

      for (let i = 0; i < snowCount; i++) {
        const flake = document.createElement('a-image');
        flake.setAttribute('src', '#snowflake');
        flake.setAttribute('width', flakeSize);
        flake.setAttribute('height', flakeSize);
        flake.setAttribute('transparent', true);

        let x = (Math.random() - 0.5) * 100;
        let y = Math.random() * 40 + 10;
        let z = (Math.random() - 0.5) * 100;

        flake.setAttribute('position', { x, y, z });

        flake.setAttribute('animation', {
          property: 'position',
          to: `${x} -20 ${z}`,
          dur: 6000 + Math.random() * 3000,
          easing: 'linear',
          loop: true
        });

        flake.setAttribute('animation__rotate', {
          property: 'rotation',
          to: `0 0 ${Math.random() * 360}`,
          dur: 5000 + Math.random() * 2000,
          loop: true
        });

        scene.appendChild(flake);
      }
    }
  });
</script>

</html>
